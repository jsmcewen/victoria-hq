# Victoria HQ on Home Assistant OS (Portainer) or any Docker host.
#
# 1. Copy this project onto the machine (Samba share /share/victoria-hq is easiest).
# 2. Copy env.example to .env and set BETTER_AUTH_URL to the https address the iPads will use.
# 3. docker compose up -d --build
#
# Sign-in cookies require https. Use Duck DNS + Nginx Proxy Manager, or a
# Cloudflare Tunnel. http://192.168.x.x will not keep anyone signed in.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: victoria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-victoria-change-me}
      POSTGRES_DB: victoria_hq
    volumes:
      - victoria_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victoria -d victoria_hq"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: victoria-hq:local
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://victoria:${POSTGRES_PASSWORD:-victoria-change-me}@db:5432/victoria_hq
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://chores.example.com}
      XAI_API_KEY: ${XAI_API_KEY:-}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
    volumes:
      - victoria_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  victoria_pg:
  victoria_data:
